<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halley & Noah - Disney Fairytale Wedding</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F5A0AD'><path d='M12 2L9.5 6H11v3H8V7L6 9v2H4V8L2 10v11h20V10l-2-2v3h-2V9l-2-2v2h-3V6h1.5L12 2zm0 8a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm-6 8h12v3H6v-3z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              lavender: '#CCA5C9',
              blush: '#FFD3DD',
              rose: '#F5A0AD',
              powder: '#BED1E3',
              slate: '#92A1C3',
              deep: '#1B2433'
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            script: ['Pinyon Script', 'cursive'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #92A1C3;
      border-radius: 4px;
    }

    /* Light Background */
    body {
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #f8fafc 70%, #f1f5f9 100%);
      color: #1B2433;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Solid Heading Text Color */
    .solid-heading {
      color: #1B2433;
    }

    /* Clean Light Glassmorphism Cards */
    .disney-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(190, 209, 227, 0.6);
      box-shadow: 0 10px 30px 0 rgba(27, 36, 51, 0.05), 0 0 15px rgba(204, 165, 201, 0.1);
      border-radius: 1rem;
      transition: all 0.3s ease;
    }

    .disney-card:hover {
      border-color: rgba(245, 160, 173, 0.8);
      box-shadow: 0 15px 35px 0 rgba(27, 36, 51, 0.08), 0 0 20px rgba(245, 160, 173, 0.2);
    }

    /* Solid / Soft Buttons */
    .btn-theme {
      background: linear-gradient(135deg, #F5A0AD 0%, #CCA5C9 100%);
      color: #1B2433;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(245, 160, 173, 0.3);
    }

    .btn-theme:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 160, 173, 0.5);
      background: linear-gradient(135deg, #FFD3DD 0%, #F5A0AD 100%);
    }

    /* Sparkle Overlay Canvas */
    #sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Castle Glow */
    .castle-glow {
      filter: drop-shadow(0px 0px 8px rgba(245, 160, 173, 0.5));
    }

    /* Ornamental Dividers */
    .theme-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2rem 0;
    }

    .theme-divider::before,
    .theme-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(146, 161, 195, 0.4), transparent);
    }

    .theme-divider-icon {
      padding: 0 1rem;
      color: #F5A0AD;
    }
  </style>
</head>
<body class="relative min
